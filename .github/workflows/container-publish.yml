name: Container Publish

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Build, scan, and publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build single-platform image for validation
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: pagmanager:release-check
          cache-from: type=gha,scope=pagmanager

      - name: Check compressed image size
        run: bash scripts/check-compressed-image-size.sh pagmanager:release-check

      - name: Scan image for critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pagmanager:release-check
          format: table
          severity: CRITICAL
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/pagmanager
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=sha,prefix=sha-

      - name: Build and publish multi-architecture image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=pagmanager
          cache-to: type=gha,scope=pagmanager,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published GHCR image and persisted data
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pagmanager@${IMAGE_DIGEST}"
          docker pull "$image"
          bash scripts/container-smoke.sh "$image"

      - name: Remove local Docker images
        if: always()
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          docker image rm pagmanager:release-check >/dev/null 2>&1 || true
          if [ -n "${IMAGE_DIGEST:-}" ]; then
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/pagmanager@${IMAGE_DIGEST}"
            docker image rm "$image" >/dev/null 2>&1 || true
          fi
