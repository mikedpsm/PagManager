name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format (Biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Biome
        uses: biomejs/setup-biome@v2
        with:
          version: '2.5.14'

      - name: Run Biome CI checks
        run: biome ci .

  contracts:
    name: Contracts (${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    defaults:
      run:
        working-directory: packages/contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: packages/contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm test

      - name: Build contracts package
        run: npm run build

      - name: Verify build artifacts
        run: |
          test -f dist/index.js || { echo "Missing dist/index.js"; exit 1; }
          test -f dist/index.d.ts || { echo "Missing dist/index.d.ts"; exit 1; }
          echo "Contracts build artifacts verified successfully."

  db:
    name: Database (migrate + seed + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pagmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/pagmanager
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build db package
        run: pnpm --filter @pagmanager/db build

      - name: Typecheck db package
        run: pnpm --filter @pagmanager/db typecheck

      - name: Run migrations
        run: pnpm db:migrate

      - name: Run seed
        run: pnpm db:seed

      - name: Run db tests (in-memory PGlite + real Postgres)
        run: pnpm --filter @pagmanager/db test

  ci-status:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs:
      - lint
      - contracts
      - db
    if: always()
    steps:
      - name: Evaluate status
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]]; then
            echo "Lint job failed or was cancelled (result: ${{ needs.lint.result }})."
            exit 1
          fi
          if [[ "${{ needs.contracts.result }}" != "success" ]]; then
            echo "Contracts job failed or was cancelled (result: ${{ needs.contracts.result }})."
            exit 1
          fi
          if [[ "${{ needs.db.result }}" != "success" ]]; then
            echo "Database job failed or was cancelled (result: ${{ needs.db.result }})."
            exit 1
          fi
          echo "All CI workflow checks passed successfully!"
